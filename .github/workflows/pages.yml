name: Deploy Bot Desk to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable GitHub Pages via GITHUB_TOKEN
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          AUTH="Authorization: Bearer ${GITHUB_TOKEN}"
          ACCEPT="Accept: application/vnd.github+json"
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"
          STATUS="$(curl -sS -o /tmp/pages.json -w "%{http_code}" -H "$AUTH" -H "$ACCEPT" "$API" || true)"
          if [ "$STATUS" = "404" ]; then
            curl -sS -X POST -H "$AUTH" -H "$ACCEPT" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$API" \
              -d '{"build_type":"workflow"}'
          else
            curl -sS -X PUT -H "$AUTH" -H "$ACCEPT" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$API" \
              -d '{"build_type":"workflow"}'
          fi

      - name: Stage static site
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          touch _site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
